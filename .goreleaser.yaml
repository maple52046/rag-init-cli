version: 2

project_name: rag-init

before:
  hooks:
    - go test ./...

builds:
  - id: rag-init
    main: ./cmd/rag-init
    binary: rag-init
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: rag-init
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-TW.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
